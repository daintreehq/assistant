name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.8"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Pure-Go SQLite (modernc.org/sqlite) — no CGO needed.
      - name: Build
        run: go build ./...

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The generated capability reference and compatibility manifest are projected from
      # the live registry and the protocol constants. Regenerating here and diffing means
      # a tool, command, or version added without regenerating fails the build instead of
      # shipping documentation that describes a different binary — the drift that left
      # three hand-maintained inventories disagreeing with each other and with the code.
      - name: Generated docs are current
        run: |
          go test ./internal/app -run TestGeneratedDocsAreCurrent -update
          go test ./internal/commands -run TestGeneratedCommandRefIsCurrent -update
          # `git status --porcelain`, NOT `git diff`: a brand-new generated file is
          # UNTRACKED, and `git diff` reports nothing for untracked paths — so a whole
          # new generated document could be missing from the repo and this gate would
          # pass. --porcelain reports modified, deleted, and untracked alike.
          drift="$(git status --porcelain -- docs/generated)"
          if [ -n "$drift" ]; then
            echo "::error::docs/generated is stale. Regenerate and commit:"
            echo "  go test ./internal/app -run TestGeneratedDocsAreCurrent -update"
            echo "  go test ./internal/commands -run TestGeneratedCommandRefIsCurrent -update"
            echo "$drift"
            git --no-pager diff -- docs/generated
            exit 1
          fi

      # The race detector is Linux-friendly; run it here as the stricter gate.
      - name: Test (race)
        run: go test -race ./...

  # Gate job — use this as the sole required status check in branch protection.
  # Insulates against job name changes breaking required checks.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
